<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EduPulse Academy — Unified API Gateway Swagger UI</title>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css" />
  <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5.18.2/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5.18.2/favicon-16x16.png" sizes="16x16" />
  <style>
    html {
      box-sizing: border-box;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .top-banner {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .top-banner h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: #3b82f6;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .auth-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .auth-status {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-block;
    }
    .auth-status.authorized {
      background: #10b981;
      color: #fff;
    }
    .auth-status.unauthorized {
      background: #ef4444;
      color: #fff;
    }
    .btn-quick-auth {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-quick-auth:hover {
      background: #2563eb;
    }
    .token-input {
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
      width: 200px;
    }
    .top-links {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .top-links a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      transition: all 0.2s;
    }
    .top-links a:hover {
      color: #ffffff;
      background: #334155;
      border-color: #64748b;
    }
    .top-links a.eureka {
      background: #059669;
      color: #fff;
      border-color: #059669;
    }
    .top-links a.eureka:hover {
      background: #047857;
    }
  </style>
</head>
<body>
  <div class="top-banner">
    <h1>
      <span>EduPulse Academy</span>
      <span class="badge">API Gateway :8080</span>
    </h1>

    <div class="auth-toolbar">
      <span id="auth-status" class="auth-status unauthorized">Checking Token...</span>
      <button class="btn-quick-auth" id="btn-auto-login" title="Authenticate as Admin and inject Bearer token into Swagger UI">
        Auto-Login as Admin
      </button>
      <input type="text" id="manual-token" class="token-input" placeholder="Paste Bearer Token..." />
      <button class="btn-quick-auth" id="btn-apply-token" style="background: #475569;">Apply</button>
    </div>

    <div class="top-links">
      <a class="eureka" href="http://localhost:8761" target="_blank">Eureka (:8761)</a>
      <a href="http://localhost:8081/swagger-ui.html" target="_blank">Auth UI (:8081)</a>
      <a href="http://localhost:8082/swagger-ui.html" target="_blank">Student UI (:8082)</a>
      <a href="http://localhost:8083/swagger-ui.html" target="_blank">Attendance UI (:8083)</a>
      <a href="http://localhost:8084/swagger-ui.html" target="_blank">Result UI (:8084)</a>
    </div>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script>
    let currentToken = localStorage.getItem("edupulse_jwt_token") || "";

    function setAuthToken(token) {
      if (!token) return;
      token = token.trim();
      if (!token.startsWith("Bearer ") && token.length > 20) {
        token = "Bearer " + token;
      }
      currentToken = token;
      localStorage.setItem("edupulse_jwt_token", token);

      if (window.ui) {
        window.ui.preauthorizeApiKey("BearerAuth", token.replace(/^Bearer\s+/i, ""));
      }

      const statusEl = document.getElementById("auth-status");
      statusEl.className = "auth-status authorized";
      statusEl.textContent = "Authorized (JWT Active)";
      const inputEl = document.getElementById("manual-token");
      if (inputEl) inputEl.value = token;
    }

    async function autoLoginAdmin() {
      try {
        const res = await fetch("http://localhost:8080/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: "admin", password: "Admin123" })
        });
        if (res.ok) {
          const data = await res.json();
          if (data && data.token) {
            setAuthToken("Bearer " + data.token);
            return;
          }
        }
      } catch (e) {
        console.warn("Auto-login failed:", e);
      }
      const statusEl = document.getElementById("auth-status");
      if (!currentToken) {
        statusEl.className = "auth-status unauthorized";
        statusEl.textContent = "Unauthorized (Click Auto-Login)";
      }
    }

    window.onload = function() {
      window.ui = SwaggerUIBundle({
        urls: [
          { name: "1. Auth Service API (/api/auth)", url: "/v3/api-docs/auth" },
          { name: "2. Student Service API (/api/students)", url: "/v3/api-docs/students" },
          { name: "3. Attendance Service API (/api/attendance)", url: "/v3/api-docs/attendance" },
          { name: "4. Result Service API (/api/results)", url: "/v3/api-docs/results" }
        ],
        "urls.primaryName": "1. Auth Service API (/api/auth)",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        persistAuthorization: true,
        requestInterceptor: (req) => {
          if (currentToken && !req.headers["Authorization"]) {
            req.headers["Authorization"] = currentToken.startsWith("Bearer ") ? currentToken : "Bearer " + currentToken;
          }
          return req;
        },
        responseInterceptor: (res) => {
          try {
            if (res.url && res.url.includes("/api/auth/login") && res.status === 200 && res.body && res.body.token) {
              setAuthToken("Bearer " + res.body.token);
            }
          } catch (e) {}
          return res;
        }
      });

      document.getElementById("btn-auto-login").addEventListener("click", autoLoginAdmin);
      document.getElementById("btn-apply-token").addEventListener("click", () => {
        const val = document.getElementById("manual-token").value;
        if (val) setAuthToken(val);
      });

      // Try restoring saved token or auto-login
      if (currentToken) {
        setAuthToken(currentToken);
      } else {
        autoLoginAdmin();
      }
    };
  </script>
</body>
</html>
