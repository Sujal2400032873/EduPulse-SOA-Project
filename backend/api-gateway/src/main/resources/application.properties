# =========================================================
# API GATEWAY
# =========================================================
spring.application.name=api-gateway
server.port=8080

# =========================================================
# EUREKA CLIENT
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=3

# =========================================================
# LOAD BALANCER
# =========================================================
spring.cloud.loadbalancer.cache.ttl=3s

# =========================================================
# ROUTES
# =========================================================

# Auth Service Route
spring.cloud.gateway.server.webflux.routes[0].id=auth-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# Student Service Route
spring.cloud.gateway.server.webflux.routes[1].id=student-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://STUDENT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/students/**

# Attendance Service Route
spring.cloud.gateway.server.webflux.routes[2].id=attendance-service-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ATTENDANCE-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/attendance/**

# Result Service Route
spring.cloud.gateway.server.webflux.routes[3].id=result-service-route
spring.cloud.gateway.server.webflux.routes[3].uri=lb://RESULT-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/results/**

# Swagger Docs Route for Auth Service
spring.cloud.gateway.server.webflux.routes[4].id=auth-service-v3-docs
spring.cloud.gateway.server.webflux.routes[4].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/v3/api-docs/auth/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=RewritePath=/v3/api-docs/auth(?<segment>.*), /v3/api-docs${segment}

# Swagger Docs Route for Student Service
spring.cloud.gateway.server.webflux.routes[5].id=student-service-v3-docs
spring.cloud.gateway.server.webflux.routes[5].uri=lb://STUDENT-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/v3/api-docs/students/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=RewritePath=/v3/api-docs/students(?<segment>.*), /v3/api-docs${segment}

# Swagger Docs Route for Attendance Service
spring.cloud.gateway.server.webflux.routes[6].id=attendance-service-v3-docs
spring.cloud.gateway.server.webflux.routes[6].uri=lb://ATTENDANCE-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/v3/api-docs/attendance/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=RewritePath=/v3/api-docs/attendance(?<segment>.*), /v3/api-docs${segment}

# Swagger Docs Route for Result Service
spring.cloud.gateway.server.webflux.routes[7].id=result-service-v3-docs
spring.cloud.gateway.server.webflux.routes[7].uri=lb://RESULT-SERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/v3/api-docs/results/**
spring.cloud.gateway.server.webflux.routes[7].filters[0]=RewritePath=/v3/api-docs/results(?<segment>.*), /v3/api-docs${segment}

# SOAP Service Route
spring.cloud.gateway.server.webflux.routes[8].id=soap-service-route
spring.cloud.gateway.server.webflux.routes[8].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/ws, /ws/**