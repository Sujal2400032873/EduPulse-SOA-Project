# =========================================================
# API GATEWAY
# =========================================================

spring.application.name=api-gateway
server.port=8080


# =========================================================
# EUREKA CLIENT
# =========================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=api-gateway:8080

eureka.client.registry-fetch-interval-seconds=5


# =========================================================
# LOAD BALANCER
# =========================================================

spring.cloud.loadbalancer.cache.ttl=5s


# =========================================================
# AUTH SERVICE ROUTE
# =========================================================

spring.cloud.gateway.server.webflux.routes[0].id=auth-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH_SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**


# =========================================================
# STUDENT SERVICE ROUTE
# =========================================================

spring.cloud.gateway.server.webflux.routes[1].id=student-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://STUDENT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/students/**


# =========================================================
# ATTENDANCE SERVICE ROUTE
# =========================================================

spring.cloud.gateway.server.webflux.routes[2].id=attendance-service-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ATTENDANCE-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/attendance/**


# =========================================================
# RESULT SERVICE ROUTE
# =========================================================

spring.cloud.gateway.server.webflux.routes[3].id=result-service-route
spring.cloud.gateway.server.webflux.routes[3].uri=lb://RESULT-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/results/**